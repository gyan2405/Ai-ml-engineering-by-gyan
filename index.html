<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Journey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<title>AI Journey 180 - Bachon ke liye AI</title>
<style>
:root{--bg:#14123b;--card:#231f5c;--sun:#ffd23f;--paper:#fff8e7;--mint:#3ddc97;--coral:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Fredoka,ui-rounded,"Segoe UI",system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 90px}
.hero{text-align:center;padding-top:10px}
.rocket{font-size:84px;display:inline-block;animation:launch 1.4s cubic-bezier(.2,1.2,.4,1) both,float 3s 1.4s ease-in-out infinite;filter:drop-shadow(0 12px 18px #0006)}
@keyframes launch{from{transform:translateY(420px) rotate(-8deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes float{50%{transform:translateY(-12px) rotate(4deg)}}
h1{font-size:clamp(30px,8vw,48px);line-height:1.1;margin:6px 0 8px;animation:pop .7s 1s both}
h1 b{color:var(--sun)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.hero p{font-size:18px;margin:0 auto;max-width:430px;opacity:.9;line-height:1.45}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}
.pill{background:var(--card);border-radius:20px;padding:12px 6px;text-align:center;font-size:13px}
.pill b{display:block;font-size:28px;color:var(--sun)}
.fuel{background:var(--card);border-radius:22px;padding:16px 16px 14px}
.fuel p{margin:0 0 10px;font-size:15px}
.track{position:relative;height:18px;background:#0005;border-radius:99px;margin-right:26px}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sun));transition:width .8s cubic-bezier(.3,1.3,.5,1)}
.fr{position:absolute;top:-11px;left:0;font-size:30px;transform:translateX(-30%) rotate(90deg);transition:left .8s cubic-bezier(.3,1.3,.5,1)}
h2{font-size:24px;margin:28px 0 12px}
.worlds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.world{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:3px solid transparent;border-radius:26px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;transition:transform .2s,border-color .2s}
.world:active{transform:scale(.94)}
.world:focus-visible,.day:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.world.on{border-color:var(--c)}
.world b{font-size:18px}.world small{opacity:.75;font-size:12px}
.planet{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 30% 28%,#fff9,var(--c) 55%,#0006);box-shadow:0 8px 20px #0005;animation:bob 3.4s ease-in-out infinite}
.world:nth-child(2n) .planet{animation-delay:-1.2s}.world:nth-child(3n) .planet{animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-7px)}}
.bar{display:block;width:80%;height:8px;border-radius:9px;background:#0005;overflow:hidden;margin:4px 0 2px}
.bar u{display:block;height:100%;background:var(--c);transition:width .6s}
.panel{margin-top:18px;background:var(--card);border-radius:26px;padding:18px;border:3px solid var(--c);animation:pop .35s both}
.panel[hidden]{display:none}
.panel h3{margin:0 0 6px;font-size:22px}
.panel p{margin:0 0 14px;line-height:1.45;opacity:.92}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.day{all:unset;box-sizing:border-box;cursor:pointer;height:52px;border-radius:16px;background:#0004;display:grid;place-items:center;font-size:17px;font-weight:500;transition:transform .15s}
.day:active{transform:scale(.88)}
.day.ok{background:var(--c);color:#14123b;font-weight:700}
.day.next{outline:3px dashed var(--sun);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);color:#14123b;border-radius:30px 30px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;transform:translateY(110%);transition:transform .4s cubic-bezier(.3,1.2,.5,1);box-shadow:0 -10px 40px #0008;max-width:760px;margin:0 auto}
.sheet.show{transform:none}
.sheet small{font-size:15px;opacity:.7}
.sheet h4{font-size:30px;margin:4px 0}
.sheet p{font-size:19px;margin:0 0 16px}
.btn{all:unset;cursor:pointer;display:inline-block;background:var(--coral);color:#fff;font-weight:700;font-size:20px;padding:14px 26px;border-radius:99px;box-shadow:0 5px 0 #b84444;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b84444}
.btn.g{background:#ddd;color:#14123b;box-shadow:0 5px 0 #aaa}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);z-index:9;background:var(--sun);color:#14123b;font-weight:700;padding:12px 20px;border-radius:99px;transition:transform .4s cubic-bezier(.3,1.4,.5,1);text-align:center}
.toast.show{transform:translate(-50%,0)}
.conf{position:fixed;z-index:8;font-size:26px;pointer-events:none;animation:burst 1.2s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
@media (min-width:600px){.worlds{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<main>
  <section class="hero">
    <div class="rocket" aria-hidden="true">🚀</div>
    <h1>AI seekho,<br><b>180 din me!</b></h1>
    <p>Roz sirf ek chhota mission. 180 missions poore karo aur ban jao AI hero!</p>
  </section>
  <section class="pills" aria-label="Tumhari progress">
    <div class="pill">⭐<b id="n">0</b>mission poore</div>
    <div class="pill">🔥<b id="s">0</b>din ki streak</div>
    <div class="pill">🎯<b id="r">180</b>mission baaki</div>
  </section>
  <section class="fuel">
    <p>Rocket ka fuel: <b id="pt">0%</b> bhar gaya</p>
    <div class="track"><div class="fill" id="fill"></div><span class="fr" id="fr" aria-hidden="true">🚀</span></div>
  </section>
  <h2>Apni planet chuno 🪐</h2>
  <div class="worlds" id="worlds"></div>
  <section class="panel" id="panel" hidden>
    <h3 id="ph"></h3><p id="pp"></p>
    <div class="days" id="days"></div>
  </section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Mission">
  <small id="sd"></small><h4 id="st"></h4><p id="ss"></p>
  <button class="btn" id="sb"></button><button class="btn g" id="sx">Band karo</button>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
const T=[["Python Basics","Variables, numbers & strings"],["Print & Input","Talk to your computer"],["Data Types","Different kinds of information"],["Operators","Math with Python"],["If / Else","Teaching decisions"],["Loops","Making computers repeat"],["While Loops","Repeat until something happens"],["For Loops","Visit every item"],["Lists","Keep many things together"],["Tuples","Fixed collections"],["Dictionaries","Key-value storage"],["Sets","Unique items"],["Functions","Create reusable actions"],["Parameters","Give functions information"],["Return Values","Get answers from functions"],["Scope","Where variables live"],["String Methods","Work with text"],["List Methods","Work with lists"],["Exceptions","Handle mistakes"],["Files","Read and write data"],["Modules","Reuse other code"],["Packages","Useful Python tools"],["Virtual Environments","Keep projects clean"],["OOP Basics","Objects and classes"],["Classes","Create your own objects"],["Inheritance","Build from existing classes"],["Lambda","Tiny functions"],["Comprehensions","Shorter loops"],["Debugging","Find bugs"],["Python Mini Project","Build a small app"],["Numbers & Ratios","Math used in AI"],["Algebra Basics","Unknown numbers"],["Functions in Math","Input → output"],["Graphs","See relationships"],["Coordinates","Points in space"],["Vectors","Arrows with numbers"],["Matrices","Number grids"],["Matrix Operations","Transform data"],["Probability","How likely?"],["Statistics","Understand data"],["Mean & Median","Find the center"],["Variance","How spread out?"],["Distributions","Shapes of data"],["Derivatives","How fast things change"],["Gradients","Direction of change"],["Optimization","Find better answers"],["Linear Algebra","Language of ML"],["Math for ML","Putting it together"],["Math Quiz","Test yourself"],["Math Mini Project","Apply the math"],["What is Data?","Information for computers"],["CSV Files","Simple data tables"],["Pandas","Python data tool"],["DataFrames","Tables in Python"],["Filtering Data","Find useful rows"],["Sorting Data","Arrange information"],["Missing Values","Incomplete data"],["Cleaning Data","Make data useful"],["Duplicates","Remove repeated data"],["Outliers","Strange data points"],["Data Visualization","Make data visible"],["Matplotlib","Basic charts"],["Seaborn","Visualize statistics"],["Feature Engineering","Create useful inputs"],["Train / Test Split","Separate learning data"],["Correlation","Things moving together"],["Data Leakage","A common ML mistake"],["Exploratory Analysis","Ask data questions"],["Data Project","Analyze a dataset"],["Data Quiz","Test yourself"],["SQL Basics","Talk to databases"],["Joins","Combine tables"],["Aggregations","Summarize data"],["Data Pipeline","Move and prepare data"],["Data Mini Project","Build a pipeline"],["What is ML?","Computers learning patterns"],["Supervised Learning","Learn from examples"],["Unsupervised Learning","Find hidden groups"],["Regression","Predict numbers"],["Classification","Predict categories"],["Linear Regression","Simple prediction"],["Logistic Regression","Classification math"],["Decision Trees","Ask yes/no questions"],["Random Forest","Many trees together"],["KNN","Look at nearby examples"],["SVM","Find a separating boundary"],["Naive Bayes","Probability-based learning"],["Clustering","Group similar things"],["K-Means","Popular clustering"],["PCA","Compress information"],["Feature Scaling","Put values on similar scales"],["Cross Validation","Test more reliably"],["Overfitting","Memorizing instead of learning"],["Underfitting","Learning too little"],["Bias & Variance","Two ML problems"],["Accuracy","How often correct?"],["Precision","Correct positive predictions"],["Recall","Find the positives"],["F1 Score","Balance precision and recall"],["Confusion Matrix","See classification results"],["ROC & AUC","Ranking predictions"],["Hyperparameters","Settings for models"],["Grid Search","Try many settings"],["Random Search","Search settings efficiently"],["Feature Selection","Keep useful features"],["Imbalanced Data","Unequal classes"],["ML Pipelines","Automate ML steps"],["Model Saving","Save trained models"],["ML Project","Build a predictor"],["ML Quiz","Test yourself"],["Neural Networks","Brain-inspired math"],["Neurons","Tiny processing units"],["Weights & Bias","What a neuron learns"],["Activation Functions","Add non-linearity"],["ReLU","Popular activation"],["Sigmoid","Squash values between 0 and 1"],["Forward Pass","Make a prediction"],["Loss Function","Measure the prediction error"],["Backpropagation","Calculate how weights should change"],["Gradient Descent","Improve weights step by step"],["Epochs & Batches","How training works"],["Optimizers","Update model parameters"],["Learning Rate","How big each step is"],["CNNs","Understand images"],["RNNs","Understand sequences"],["LSTMs","Learn longer sequence patterns"],["Embeddings","Turn things into vectors"],["Transfer Learning","Reuse learned knowledge"],["PyTorch Basics","Deep learning framework"],["TensorFlow Basics","Another DL framework"],["GPU Basics","Fast matrix calculations"],["Regularization","Reduce overfitting"],["Dropout","Randomly disable units during training"],["Deep Learning Project","Train a neural network"],["DL Quiz","Test yourself"],["Generative AI","AI that creates"],["LLMs","Large Language Models"],["Tokens","How text is split"],["Embeddings","Represent meaning as numbers"],["Transformers","Modern language architecture"],["Attention","Focus on relevant information"],["Prompting","Give AI clear instructions"],["System Prompts","Set assistant behavior"],["Few-Shot Prompting","Teach with examples"],["Structured Output","Get predictable responses"],["Temperature","Adjust response randomness"],["Context Window","How much input a model can process"],["RAG","Give AI relevant documents"],["Vector Databases","Search by semantic similarity"],["Chunking","Split documents intelligently"],["Retrieval","Find useful information"],["Reranking","Improve search result order"],["Tool Calling","Let AI use tools"],["Agents","AI systems that use tools in steps"],["Function Calling","Connect AI to code"],["AI Safety","Build responsibly"],["GenAI App","Build your first AI app"],["GenAI Quiz","Test yourself"],["Prompt Project","Create useful prompts"],["RAG Mini Project","Build document Q&A"],["APIs","Connect software"],["REST APIs","Web communication"],["FastAPI","Python backend"],["Frontend Basics","Build interfaces"],["JavaScript Basics","Make pages interactive"],["Git","Track your code"],["GitHub","Host and share projects"],["Docker","Package applications"],["Environment Variables","Configure apps and protect secrets"],["Authentication","Control access"],["Databases","Store application data"],["Cloud Basics","Run software online"],["Model Deployment","Put AI into production"],["Monitoring","Watch your AI app"],["Logging","Understand what happened"],["Testing","Make software reliable"],["CI/CD","Automate testing and deployment"],["Scaling","Handle more users"],["AI Engineering Project","Build an AI service"],["🎓 Final Capstone","Build your complete AI application"]];
const W=[
["Python","🐍",1,30,"#ffb020","Computer se baat karne ki bhasha. Ye seekh ke tum computer ko hukum de sakte ho!"],
["Math","📐",31,50,"#9b7bff","AI ki secret power! Numbers aur patterns ka mazedaar khel."],
["Data","📊",51,75,"#3ddc97","AI ka khaana! Data jitna accha, AI utna smart."],
["ML","🤖",76,110,"#ff6b6b","Computer ko examples dikha ke sikhana, bilkul jaise tum seekhte ho."],
["Deep Learning","🧠",111,135,"#4cc9f0","Insaan ke dimaag jaisa jaal, jo khud seekhta hai."],
["GenAI","✨",136,160,"#ff7ac6","AI jo kahani, tasveer aur baatein khud banata hai."],
["AI Engineering","⚙️",161,180,"#b39cff","Apna khud ka AI app banao aur duniya ko dikhao!"]];
const $=id=>document.getElementById(id);
const iso=d=>d.toLocaleDateString("en-CA");
let done={},cur=-1,day=0;
try{done=JSON.parse(localStorage.getItem("aij_kids")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("aij_kids",JSON.stringify(done))}catch(e){}};
const cnt=(a,b)=>{let c=0;for(let i=a;i<=b;i++)if(done[i])c++;return c};
function streak(){const s=new Set(Object.values(done));let d=new Date(),n=0;if(!s.has(iso(d)))d.setDate(d.getDate()-1);while(s.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function render(){
  const n=Object.keys(done).length,p=Math.round(n/1.8);
  $("n").textContent=n;$("s").textContent=streak();$("r").textContent=180-n;
  $("pt").textContent=p+"%";$("fill").style.width=p+"%";$("fr").style.left=p+"%";
  $("worlds").innerHTML=W.map((w,i)=>{const t=w[3]-w[2]+1,c=cnt(w[2],w[3]);
    return `<button class="world${i===cur?" on":""}" style="--c:${w[4]}" data-i="${i}"><span class="planet">${w[1]}</span><b>${w[0]}</b><small>Din ${w[2]}-${w[3]}</small><i class="bar"><u style="width:${Math.round(c/t*100)}%"></u></i><small>${c}/${t} mission</small></button>`}).join("");
  if(cur>=0){const w=W[cur];let nx=0,h="";
    for(let i=w[2];i<=w[3];i++)if(!done[i]){nx=i;break}
    for(let i=w[2];i<=w[3];i++)h+=`<button class="day${done[i]?" ok":""}${i===nx?" next":""}" data-d="${i}" aria-label="Din ${i}">${done[i]?"✓":i}</button>`;
    $("days").innerHTML=h;$("panel").style.setProperty("--c",w[4]);
    $("ph").textContent=w[1]+" "+w[0]+" planet";$("pp").textContent=w[5]+" Chamakte number pe tap karo, wo tumhara agla mission hai.";$("panel").hidden=false}
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function boom(){const e=["⭐","🎉","✨","🌟","🚀"];
  for(let i=0;i<22;i++){const s=document.createElement("span");s.className="conf";s.textContent=e[i%5];
    s.style.left="50%";s.style.top="60%";s.style.setProperty("--x",(Math.random()*340-170)+"px");s.style.setProperty("--y",(-Math.random()*320-40)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
function openSheet(d){day=d;$("sd").textContent="Din "+d;$("st").textContent=T[d-1][0];$("ss").textContent=T[d-1][1];
  $("sb").textContent=done[d]?"Wapas karo":"Mission poora! 🎉";$("sheet").classList.add("show")}
$("worlds").onclick=e=>{const b=e.target.closest(".world");if(!b)return;cur=+b.dataset.i;render();$("panel").scrollIntoView({behavior:"smooth",block:"nearest"})};
$("days").onclick=e=>{const b=e.target.closest(".day");if(b)openSheet(+b.dataset.d)};
$("sx").onclick=()=>$("sheet").classList.remove("show");
$("sb").onclick=()=>{
  if(done[day]){delete done[day]}else{done[day]=iso(new Date());boom();
    const w=W.find(w=>day>=w[2]&&day<=w[3]);
    if(cnt(w[2],w[3])===w[3]-w[2]+1)toast("🏆 "+w[0]+" planet jeet li!");
    else toast("Shabash! Ek mission aur poora ⭐")}
  save();$("sheet").classList.remove("show");render()};
const sky=$("sky");for(let i=0;i<46;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=(Math.random()*3)+"s";sky.appendChild(s)}
render();
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
